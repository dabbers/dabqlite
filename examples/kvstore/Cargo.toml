[package]
name = "kvstore"
version = "0.1.0"
edition = "2021"
publish = false
description = "A durable command-line key/value + session store built on dabqlite."

[dependencies]
dabqlite = { path = "../../crates/dabqlite" }

[[bin]]
name = "kv"
path = "src/main.rs"

[lib]
name = "kvstore"
path = "src/lib.rs"

# This crate is deliberately OUTSIDE the dabqlite workspace (the root
# manifest excludes `examples/`). Saying so explicitly stops cargo from
# walking further up the filesystem and adopting some unrelated ancestor
# workspace when the checkout is nested inside one (e.g. a git worktree
# under the main clone).
[workspace]
