[package]
name = "dabqlite-host"
description = "Storage backends and the generic host driver for dabqlite-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dabqlite-core = { path = "../dabqlite-core" }

[dev-dependencies]
dabqlite-sim = { path = "../dabqlite-sim" }

[target.'cfg(unix)'.dependencies]
# `fcntl(F_SETLK)` for the single-writer lock, and the ENOSPC errno the
# disk-full test asserts on. Record locks rather than `flock` because
# `flock` is inherited by forked children and record locks are not — see
# `WriterLock` in src/posix.rs. This is the only FFI in the workspace.
libc = "0.2"

[lints]
workspace = true
