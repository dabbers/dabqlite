[package]
name = "dabqlite-host"
description = "Storage backends and the generic host driver for dabqlite-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dabqlite-core = { path = "../dabqlite-core" }

[target.'cfg(unix)'.dependencies]
# flock only: the single-writer lock (docs/DESIGN.md §2: "one writer,
# always") needs an advisory lock that the kernel releases on process
# death, which std does not expose.
libc = "0.2"

[dev-dependencies]
dabqlite-sim = { path = "../dabqlite-sim" }

[lints]
workspace = true
