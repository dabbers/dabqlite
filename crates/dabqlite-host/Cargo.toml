[package]
name = "dabqlite-host"
description = "Storage backends and the generic host driver for dabqlite-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dabqlite-core = { path = "../dabqlite-core" }

[dev-dependencies]
dabqlite-sim = { path = "../dabqlite-sim" }

[target.'cfg(unix)'.dev-dependencies]
# Constants only (the ENOSPC errno in the disk-full test). The
# single-writer lock uses std's `File::try_lock` (flock on Linux), so
# production code needs no libc and contains no unsafe.
libc = "0.2"

[lints]
workspace = true
