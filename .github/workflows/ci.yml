name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, wasm gate, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (determinism deny list, docs/DESIGN.md §7.1)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The gate that cannot be argued with (docs/DESIGN.md §7.1):
      # wasm32-unknown-unknown has no clock, no randomness, and no
      # filesystem, so ambient nondeterminism in the core fails to link.
      - name: Determinism gate (core builds for wasm32-unknown-unknown)
        run: cargo build -p dabqlite-core --target wasm32-unknown-unknown

      - name: Tests (unit, model-based, crash-recovery sweep)
        run: cargo test --workspace

      # The generated codec is checked in (and load-bearing in the core);
      # regenerating must be a no-op.
      - name: Codegen drift check
        run: |
          cargo run -p dabqlite-codegen -- schema/records.sql \
            crates/dabqlite-core/src/generated/records.rs \
            schema/queries.sql \
            crates/dabqlite-core/src/generated/queries.rs
          git diff --exit-code

      # A short randomized soak on top of the deterministic sweeps. Any
      # failure prints the seed that reproduces it.
      - name: VOPR soak (200 random lifetimes)
        run: cargo run --release -p dabqlite-sim --bin vopr -- --runs 200
