name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, wasm gate, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (determinism deny list, docs/DESIGN.md §7.1)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The gate that cannot be argued with (docs/DESIGN.md §7.1):
      # wasm32-unknown-unknown has no clock, no randomness, and no
      # filesystem, so ambient nondeterminism in the core fails to link.
      - name: Determinism gate (core builds for wasm32-unknown-unknown)
        run: cargo build -p dabqlite-core --target wasm32-unknown-unknown

      # The OPFS backend is a wasm-only crate, so native clippy never sees
      # it. Lint it on the target it actually ships to.
      - name: "Clippy (wasm32: the OPFS backend)"
        run: cargo clippy -p dabqlite-web --target wasm32-unknown-unknown --all-targets -- -D warnings

      - name: Tests (unit, model-based, crash-recovery sweep)
        run: cargo test --workspace

      # The sample applications live OUTSIDE the workspace on purpose:
      # they consume the published API the way a real user would, so if
      # one needs something the API does not expose it fails to build
      # instead of quietly reaching inside. That only works if something
      # builds them. Nothing did, and all three rotted into a state where
      # they no longer compiled against the library they exist to
      # validate. Compiling and linting them here is the cheap half; the
      # expensive half (crash torture, throughput measurement) stays a
      # local and agent-driven exercise, because it is timing-sensitive
      # and kills processes.
      - name: Sample applications still compile against the published API
        run: |
          for s in examples/*/; do
            echo "== $s"
            (cd "$s" && cargo build --all-targets \
                     && cargo clippy --all-targets -- -D warnings \
                     && cargo fmt --check)
          done

      # The generated codec is checked in (and load-bearing in the core);
      # regenerating must be a no-op.
      - name: Codegen drift check
        run: |
          cargo run -p dabqlite-codegen -- schema/records.sql \
            crates/dabqlite-core/src/generated/records.rs \
            schema/queries.sql \
            crates/dabqlite-core/src/generated/queries.rs \
            --format-doc schema/records_v1.sql docs/FORMAT.md
          cargo run -p dabqlite-codegen -- schema/records_v1.sql \
            crates/dabqlite-core/src/generated/records_v1.rs
          git diff --exit-code

      # Real OPFS in a real browser (docs/DESIGN.md §8.1). The backend's
      # contract suite runs natively above; this proves the model of the
      # sync-access-handle API is not a fiction. GitHub runners ship Chrome
      # plus a matching chromedriver (CHROMEWEBDRIVER); the wasm-bindgen
      # CLI must match the wasm-bindgen crate version in Cargo.lock, so it
      # is derived from the lock file rather than pinned twice.
      - name: Browser tests (real OPFS, headless Chrome, dedicated worker)
        run: |
          VERSION=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock \
            | grep '^version' | head -1 | cut -d'"' -f2)
          echo "wasm-bindgen $VERSION"
          cargo install wasm-bindgen-cli --version "$VERSION" --locked
          export CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver"
          cargo test -p dabqlite-web --target wasm32-unknown-unknown

      # Scale suites run in release (the profile keeps debug-assertions on,
      # so no assertion coverage is lost): 1M rows simulated, 100k on real
      # files with real fsyncs.
      - name: Scale (1M rows sim, 100k rows real files)
        run: |
          cargo test -p dabqlite-sim --test scale --release -- --ignored
          cargo test -p dabqlite-host --test scale_posix --release -- --ignored

      # GENUINE ENOSPC: a 256K tmpfs, filled until the kernel refuses the
      # writes. The test skips itself without this mount; CI provides it.
      - name: Real ENOSPC episode (size-capped tmpfs)
        run: |
          sudo mkdir -p /mnt/dabqlite-enospc
          sudo mount -t tmpfs -o size=256k,mode=0777 tmpfs /mnt/dabqlite-enospc
          DABQLITE_ENOSPC_DIR=/mnt/dabqlite-enospc \
            cargo test -p dabqlite-host --test enospc -- --nocapture
          sudo umount /mnt/dabqlite-enospc

      # A short randomized soak on top of the deterministic sweeps. Any
      # failure prints the seed that reproduces it.
      - name: VOPR soak (200 random lifetimes)
        run: cargo run --release -p dabqlite-sim --bin vopr -- --runs 200

  # Compiling the samples is the cheap half and lives in the job above.
  # This is the other half, and it exists because compiling was not
  # enough: widening the commit span (row format v6) broke EIGHT sample
  # tests that no CI job ran, every one of them a real statement about the
  # API's contract. The samples are the library's regression suite for
  # everything an application can feel, so they get run.
  #
  # The exclusions are the timing-sensitive harnesses: they SIGKILL child
  # processes at microsecond offsets and measure throughput, which is a
  # local and agent-driven exercise rather than something to flake on a
  # shared runner. Everything else runs, including anything added later —
  # the list below is what is skipped, not what is kept.
  samples:
    name: sample application test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Sample application tests
        run: |
          skip="batch_crash crash concurrency throughput"
          for s in examples/*/; do
            echo "== $s"
            (
              cd "$s"
              cargo test --lib
              for t in tests/*.rs; do
                name=$(basename "$t" .rs)
                case " $skip " in
                  *" $name "*) echo "-- skipping $name (timing-sensitive)"; continue ;;
                esac
                echo "-- $name"
                cargo test --test "$name"
              done
            )
          done
